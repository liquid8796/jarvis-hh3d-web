# Cào bảng Usage của từng trạm rồi đẩy lên tab Gương Trạm.
#
# CÁI GÌ ĐƯỢC LẤY: đúng tám cột — `WANTED_TITLES` trong `scripts/usageMeters.mts`,
# sửa danh sách thì sửa ở đó, không sửa ở đây. Trước 13/08/2026 lượt cào đẩy trọn ~54 meter của
# trang, phần lớn là số 0 của Queue/Sandbox/AI Gateway.
#
# VÌ SAO Ở ĐÂY chứ không phải một dịch vụ cron thường: mấy cột ấy — gồm Fluid Active CPU và
# Fluid Provisioned Memory, hai meter siết nhất một tài khoản Hobby — chỉ đọc được bằng cách
# DỰNG trang Usage trong một trình duyệt thật rồi cuộn cho nó render. Đo ngày 11/08/2026:
# `fetch` thuần chỉ đúng 1/8 lượt, và thiếu đúng mấy cột ấy. Cron dạng「gọi URL」(cron-job.org,
# EasyCron…) không mở nổi trình duyệt; function trên Vercel cũng không. GitHub Actions thì có
# sẵn Chromium, có chỗ cất bí mật tử tế, và miễn phí.
#
# COOKIE Ở ĐÂU: trong Secrets của repo, KHÔNG trong database của tông môn. Đó là cả lý do
# thiết kế này đảo chiều — thứ đi trên dây về web chỉ là tên meter và hai con số đã format,
# không một credential nào. Cookie phiên Vercel mở được `ENCRYPTION_KEY` của trạm, tức mở được
# phong bì cookie game của mọi đạo hữu; nó không được phép nằm cạnh chính thứ nó mở.
#
# NGÂN SÁCH: repo này CÔNG KHAI — đo 12/08/2026 qua API GitHub, `"visibility": "public"` — nên
# Actions trên runner tiêu chuẩn miễn phí KHÔNG GIỚI HẠN phút. Đó là điều duy nhất khiến nhịp
# nửa giờ khả thi. Mỗi lượt ~4–6 phút cho bốn trạm (cài deps + Chromium + cào), tức nhịp này
# ngốn ~7.200 phút/tháng.
#
# NẾU CÓ NGÀY ĐỔI REPO VỀ RIÊNG TƯ thì phải hạ nhịp trong cùng lượt sửa ấy: gói Free chỉ cho
# 2.000 phút/tháng, nhịp nửa giờ đốt sạch trong hơn tám ngày — và vượt trần thì lịch LẶNG LẼ
# thôi chạy, không ai được báo. Mức vừa vặn cho repo riêng tư là sáu giờ một lần (≈700 phút).
#
# CÀI ĐẶT — ba việc, làm một lần:
#   1. Settings → Secrets and variables → Actions, thêm:
#        CRON_SECRET             (đúng giá trị đang đặt trên Vercel)
#        VERCEL_COOKIE_MAIN      (nội dung tệp cookie JSON của tài khoản giữ trạm `main`)
#        VERCEL_COOKIE_<TRẠM>    (mỗi trạm một cái, tên viết HOA, gạch nối thành gạch dưới)
#   2. Sửa `stations` bên dưới cho khớp sổ gương trạm.
#   3. Actions → Vercel usage → Run workflow, để chạy thử ngay thay vì đợi tới giờ.
#
# COOKIE HẾT HẠN thì workflow ĐỎ chứ không im lặng — script từ chối in bảng thiếu. Lúc ấy xuất
# lại tệp cookie từ trình duyệt và cập nhật secret.

name: Vercel usage

on:
  schedule:
    # Nửa giờ một lần, đúng phút :00 và :30. Giờ UTC; lịch của GitHub có thể trễ vài phút khi
    # hệ thống bận, và một lượt bị trễ chờm sang lượt sau thì `concurrency` bên dưới cho nó xếp
    # hàng chứ không chen — số liệu này là cửa sổ 30 ngày, trễ một nhịp không mất gì.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Một lượt cào đang chạy dở thì lượt mới chờ, không chen: hai lượt cùng ghi vào một dòng sổ là
# lượt sau đè lượt trước với dữ liệu cũ hơn.
concurrency:
  group: vercel-usage
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chỉ Chromium, không tải cả ba engine — Playwright mặc định kéo cả Firefox lẫn WebKit,
      # tức thêm vài phút mỗi lượt cho hai thứ không ai dùng.
      - run: npx playwright install --with-deps chromium

      - name: Cào và đẩy từng trạm
        env:
          # ĐỊA CHỈ NÀY ĐƯỢC PHÉP CŨ. Trạm nghỉ vẫn 307 sang trạm đang hoạt động, và script đẩy
          # đi theo chuyển hướng ấy có gắn lại chìa (scripts/usagePush.mts). Trước 12/08/2026
          # thì không: `fetch` đi theo nhưng vứt header `Authorization` vì đổi origin, nên cả
          # hai trạm cùng báo `401 unauthorized` trong khi bí mật hoàn toàn đúng.
          WEB_URL: ${{ vars.WEB_URL || 'https://auto-hh3d.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_COOKIE_MAIN: ${{ secrets.VERCEL_COOKIE_MAIN }}
          VERCEL_COOKIE_AUTO_HH3D_1: ${{ secrets.VERCEL_COOKIE_AUTO_HH3D_1 }}
          VERCEL_COOKIE_AUTO_HH3D_2: ${{ secrets.VERCEL_COOKIE_AUTO_HH3D_2 }}
          VERCEL_COOKIE_AUTO_HH3D_3: ${{ secrets.VERCEL_COOKIE_AUTO_HH3D_3 }}
        run: |
          set -u
          # site|team slug|tên biến chứa cookie. Trạm nào chưa có secret thì BỎ QUA, không gãy:
          # thêm một trạm vào sổ mà chưa kịp dán cookie là chuyện thường.
          #
          # SLUG ĐỘI KHÁC TÊN TÀI KHOẢN — đây là chỗ đã đoán sai hai trên ba lần. Tài khoản
          # `liquid8796` có slug `freecoursecademy`, `fatrat080796-5139` có slug `smart-service`.
          # Lấy đúng bằng cách hỏi API bằng token của chính trạm ấy:
          #   GET /v2/user → defaultTeamId → GET /v2/teams/<id> → .slug
          # (cũng chính là nhãn đầu trong URL dashboard: vercel.com/<slug>)
          # Cột đầu là MÃ TRẠM trong sổ gương — `/api/usage-report` tra đúng chuỗi ấy và trả 404
          # nếu không có. Trạm gốc đổi mã `main` → `auto-hh3d` ngày 13/08/2026, lúc nó được dựng
          # lại từ đầu để gột sạch mấy biến env dạng sensitive; tên secret cookie giữ nguyên.
          stations="auto-hh3d|jarvis8796|VERCEL_COOKIE_MAIN
          auto-hh3d-1|zhangyu4|VERCEL_COOKIE_AUTO_HH3D_1
          auto-hh3d-2|freecoursecademy|VERCEL_COOKIE_AUTO_HH3D_2
          auto-hh3d-3|smart-service|VERCEL_COOKIE_AUTO_HH3D_3"

          failed=0
          # HERESTRING, KHÔNG PIPE. `echo … | while` chạy vòng lặp trong một SUBSHELL, nên
          # `failed=1` chết theo subshell ấy và `exit $failed` luôn thấy 0: lượt 12/08/2026 đẩy
          # hỏng cả hai trạm mà bước này vẫn hiện dấu ✅ xanh. Một phép thử nói dối còn tệ hơn
          # không có phép thử — nó dạy người ta thôi đọc log.
          while IFS='|' read -r site team envname; do
            site=$(echo "$site" | xargs)
            [ -z "$site" ] && continue
            # Tra gián tiếp thay cho `eval` — và `-` để một trạm mới thêm vào sổ mà quên khai
            # trong `env:` bên trên chỉ bị BỎ QUA, không cho `set -u` giết cả bước.
            if [ -z "${!envname-}" ]; then
              echo "— bỏ qua $site: chưa có secret $envname"
              continue
            fi
            echo "── $site ($team)"
            npx tsx scripts/vercelUsageFull.mts \
              --cookie-env "$envname" --team "$team" \
              --push "$WEB_URL" --site "$site" || failed=1
          done <<< "$stations"
          exit $failed
