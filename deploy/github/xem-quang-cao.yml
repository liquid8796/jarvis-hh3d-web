# HEALTH-CHECK QUẢNG CÁO — chạy trên runner của GitHub để kiểm tra placement trên website dự án.
#
# WORKFLOW CÓ THỂ SỐNG CÙNG MÃ NGUỒN DỰ ÁN. Tương tự như khôi lỗi, workflow này tải gói
# chạy health-check hiện hành vào `RUNNER_TEMP`, không cài đè package/source của repo.
# Không yêu cầu token và không tự động click quảng cáo production.
#
# BA THỨ PHẢI ĐÚNG:
#
#   1. AD_VIEWER_ID phải là định danh duy nhất.
#
#   2. Mỗi lượt chỉ chạy một health-check, chờ placement tối đa 15 giây rồi thoát.
#
#   3. Cron 4 giờ là nguồn chạy thường. Chỉ mã 90 mới được nối ngay để tải runtime mới; mọi mã
#      khác đều dừng tại đó nên một lượt ngắn không thể tự nhân bản vô hạn.

name: "__PUBLIC_WORKFLOW_NAME__"

on:
  schedule:
    # Health-check thường kỳ; runtime mới chỉ tự nối chuỗi khi chủ động thoát mã 90 để nâng bản.
    - cron: "0 */4 * * *"
  workflow_dispatch:

# Đúng MỘT lượt health-check tại một thời điểm. `cancel-in-progress: false` giữ lượt thủ công/cron
# không cắt ngang nhau.
concurrency:
  group: xem-quang-cao-github
  cancel-in-progress: false

permissions:
  contents: read
  # Đủ để POST .../actions/workflows/<tệp>/dispatches — xem bước「Phát lượt kế」ở cuối.
  actions: write

jobs:
  xem-quang-cao:
    name: "__PUBLIC_JOB_NAME__"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download current ad-viewer runtime
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://auto-hh3d.online' }}
          WORKER_FALLBACK_URL: ${{ vars.WORKER_FALLBACK_URL || 'https://auto-hh3d.online' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/xem-qc-runtime"
          rm -rf "$dir"
          mkdir -p "$dir"

          download_runtime() {
            local base="${1%/}"
            curl -fsSL --retry 3 --retry-delay 2 "$base/xem-qc/goi-xem-qc.tgz" | tar -xz -C "$dir"
          }

          if ! download_runtime "$WEB_URL"; then
            echo "::warning::Primary runtime endpoint failed; trying the trusted fallback."
            rm -rf "$dir"
            mkdir -p "$dir"
            download_runtime "$WORKER_FALLBACK_URL"
          fi

          test -f "$dir/ad-viewer.mjs"
          test -f "$dir/package.json"
          test -f "$dir/node_modules/playwright-core/cli.js"
          echo "XEM_QC_RUNTIME=$dir" >> "$GITHUB_ENV"

      - name: Install Chromium for ad-viewer runtime
        run: |
          set -eu
          cd "$XEM_QC_RUNTIME"
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Kiểm tra hiển thị quảng cáo
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://auto-hh3d.online' }}
          WORKER_FALLBACK_URL: ${{ vars.WORKER_FALLBACK_URL || 'https://auto-hh3d.online' }}
          AD_VIEWER_ID: github-xem-qc
          AD_VIEWER_AD_READY_TIMEOUT_MS: "15000"
          AD_VIEWER_SELF_UPDATE: "1"
        run: |
          set -u
          
          set +e
          node "$XEM_QC_RUNTIME/ad-viewer.mjs"
          ma=$?
          set -e
          echo "XEM_QC_EXIT=$ma" >> "$GITHUB_ENV"

          # 90 không phải lỗi: runtime chủ động xin kết thúc để chuẩn bị nâng bản.
          if [ "$ma" -eq 90 ]; then
            echo "::notice::Health-check xin kết thúc để thay runtime; lượt kế sẽ được phát ngay."
            exit 0
          fi
          exit "$ma"

      - name: Phát lượt thay runtime khi cần
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${XEM_QC_EXIT:-}" != "90" ]; then
            echo "Health-check kết thúc mã ${XEM_QC_EXIT:-chưa-rõ}; không nối chuỗi. Cron sẽ chạy lượt thường kỳ kế tiếp."
            exit 0
          fi
          echo "Runtime chủ động xin thay bản (mã 90) — phát ngay một lượt để tải gói mới."

          ma=$(curl -sS -o /tmp/noi-chuoi.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/xem-quang-cao.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}") || ma=000

          if [ "$ma" = "204" ]; then
            echo "Đã phát lượt thay runtime trên nhánh $GITHUB_REF_NAME."
          else
            echo "::error::Phát lượt kế HỎNG (HTTP $ma): $(head -c 300 /tmp/noi-chuoi.out 2>/dev/null || true)"
            echo "::error::Chuỗi đứt — đội phải chờ cron tới 4 giờ. Soi quyền actions:write của GITHUB_TOKEN."
            exit 1
          fi
