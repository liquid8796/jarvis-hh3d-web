# XEM QUẢNG CÁO TỰ ĐỘNG — chạy trên runner của GitHub để xem và click quảng cáo trên website dự án.
#
# WORKFLOW CÓ THỂ SỐNG CÙNG MÃ NGUỒN DỰ ÁN. Tương tự như khôi lỗi, workflow này tải gói
# chạy xem quảng cáo hiện hành vào `RUNNER_TEMP`, không cài đè package/source của repo.
# Không yêu cầu token vì chỉ là xem và click quảng cáo trên web.
#
# BA THỨ PHẢI ĐÚNG, và cả ba đều nằm ở dưới dạng con số:
#
#   1. AD_VIEWER_ID phải là định danh duy nhất.
#
#   2. Tuổi thọ phải NGẮN HƠN trần của nền tảng. Runner bị giết cứng ở 6 giờ.
#      thôi nhận việc ở phút 290 → chờ đóng trình duyệt tối đa 50 phút → 340 < 350 (timeout của job)
#      < 360 (trần nền tảng). Hai lớp đệm, mỗi lớp 10 phút.
#
#   3. Lịch phải DÀY HƠN tuổi thọ. 4 giờ một lần trong khi một lượt sống ~4,8 giờ, nên lượt kế
#      đã nằm chờ sẵn trong hàng đợi lúc lượt cũ rút — `concurrency` giữ đúng một lượt chạy
#      và một lượt chờ, nên hai lượt không bao giờ chồng nhau.

name: "__PUBLIC_WORKFLOW_NAME__"

on:
  schedule:
    # Lịch dày hơn tuổi thọ để lượt kế chờ sẵn
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      tuoi_tho_ms:
        description: "Tuổi thọ (ms) — để trống là dùng mặc định 290 phút"
        required: false
        default: ""

# Đúng MỘT lượt xem quảng cáo tại một thời điểm. `cancel-in-progress: false` bắt buộc.
concurrency:
  group: xem-quang-cao-github
  cancel-in-progress: false

permissions:
  contents: read
  # Đủ để POST .../actions/workflows/<tệp>/dispatches — xem bước「Phát lượt kế」ở cuối.
  actions: write

jobs:
  xem-quang-cao:
    name: "__PUBLIC_JOB_NAME__"
    runs-on: ubuntu-latest
    # 350 phút timeout
    timeout-minutes: 350
    steps:
      - name: Đánh dấu giờ bắt đầu
        run: echo "BAT_DAU_LUC=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download current ad-viewer runtime
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://auto-hh3d.online' }}
          WORKER_FALLBACK_URL: ${{ vars.WORKER_FALLBACK_URL || 'https://auto-hh3d.online' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/xem-qc-runtime"
          rm -rf "$dir"
          mkdir -p "$dir"

          download_runtime() {
            local base="${1%/}"
            curl -fsSL --retry 3 --retry-delay 2 "$base/xem-qc/goi-xem-qc.tgz" | tar -xz -C "$dir"
          }

          if ! download_runtime "$WEB_URL"; then
            echo "::warning::Primary runtime endpoint failed; trying the trusted fallback."
            rm -rf "$dir"
            mkdir -p "$dir"
            download_runtime "$WORKER_FALLBACK_URL"
          fi

          test -f "$dir/ad-viewer.mjs"
          test -f "$dir/package.json"
          test -f "$dir/node_modules/playwright-core/cli.js"
          echo "XEM_QC_RUNTIME=$dir" >> "$GITHUB_ENV"

      - name: Install Chromium for ad-viewer runtime
        run: |
          set -eu
          cd "$XEM_QC_RUNTIME"
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Xem quảng cáo
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://auto-hh3d.online' }}
          WORKER_FALLBACK_URL: ${{ vars.WORKER_FALLBACK_URL || 'https://auto-hh3d.online' }}
          AD_VIEWER_ID: github-xem-qc
          AD_VIEWER_MAX_LIFETIME_MS: ${{ inputs.tuoi_tho_ms || '17400000' }}
          AD_VIEWER_DELAY_MIN_MS: "5000"
          AD_VIEWER_DELAY_MAX_MS: "10000"
          AD_VIEWER_MAX_RECURSIVE_CLICKS: "2"
          AD_VIEWER_AD_READY_TIMEOUT_MS: "15000"
          AD_VIEWER_SELF_UPDATE: "1"
        run: |
          set -u
          
          set +e
          node "$XEM_QC_RUNTIME/ad-viewer.mjs"
          ma=$?
          set -e
          echo "XEM_QC_EXIT=$ma" >> "$GITHUB_ENV"

          # 90 không phải lỗi: worker đã thôi nhận việc mới để chuẩn bị nâng bản.
          if [ "$ma" -eq 90 ]; then
            echo "::notice::Chương trình xem quảng cáo xin kết thúc để thay runtime; lượt kế sẽ được phát ngay."
            exit 0
          fi
          exit "$ma"

      - name: Phát lượt kế
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUOI_THO_MS: ${{ inputs.tuoi_tho_ms || '17400000' }}
        run: |
          set -eu
          troi=$(( $(date +%s) - BAT_DAU_LUC ))

          if [ "${XEM_QC_EXIT:-}" = "90" ]; then
            echo "Chương trình chủ động xin thay runtime (mã 90) — bỏ phanh chết-yểu và nối chuỗi ngay."
          else
            if [ "${TUOI_THO_MS:-0}" -le 0 ]; then
              echo "::warning::Không đọc được tuổi thọ (TUOI_THO_MS='${TUOI_THO_MS:-}') — không nối chuỗi, để cron đỡ."
              exit 0
            fi

            nguong=$(( TUOI_THO_MS / 2000 ))
            if [ "$troi" -lt "$nguong" ]; then
              echo "Lượt này mới sống ${troi}s, chưa quá nửa tuổi thọ (${nguong}s) — KHÔNG nối chuỗi."
              echo "Đây là phanh: một lượt chết yểu mà vẫn phát lượt kế là đốt phút Actions vô tận."
              echo "Cron sẽ dựng lại đội trong tối đa 4 giờ."
              exit 0
            fi
          fi

          ma=$(curl -sS -o /tmp/noi-chuoi.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/xem-quang-cao.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}") || ma=000

          if [ "$ma" = "204" ]; then
            echo "Đã phát lượt kế trên nhánh $GITHUB_REF_NAME (lượt này sống ${troi}s)."
          else
            echo "::error::Phát lượt kế HỎNG (HTTP $ma): $(head -c 300 /tmp/noi-chuoi.out 2>/dev/null || true)"
            echo "::error::Chuỗi đứt — đội phải chờ cron tới 4 giờ. Soi quyền actions:write của GITHUB_TOKEN."
            exit 1
          fi
