# KHÔI LỖI TÔNG MÔN THỨ HAI — chạy trên runner của GitHub, song song với khôi lỗi trên VM.
#
# WORKFLOW CÓ THỂ SỐNG CÙNG MÃ NGUỒN DỰ ÁN. Từ 26/09/2026, repo phụ được promote giữ nguyên toàn
# bộ code cũ; Jarvis chỉ chồng tệp workflow này lên. Runner tải gói khôi lỗi hiện hành vào
# `RUNNER_TEMP`, không cài đè package/source của repo. `WORKER_TOKEN` vẫn là secret toàn cục,
# vì vậy chỉ repo chính đã được tông môn xác nhận mới được bật workflow; repo phụ luôn tắt Actions.
#
# PHỐI HỢP VỚI VM: không có cơ chế điều phối nào ở đây, và đó là chủ ý — Postgres đã phân xử
# sẵn. `claimNextJob` là MỘT câu UPDATE nguyên tử: hai khôi lỗi giành nhau thì nhận hai dòng
# khác nhau, hoặc một dòng và một null. Cộng index `jobs_one_active_per_account`, hai đàn cùng
# một tài khoản là bất khả thi về cấu trúc. Thêm một tầng "chia việc" ở đây chỉ là dựng một
# luật thứ hai sống lệch luật thật.
#
# BA THỨ PHẢI ĐÚNG, và cả ba đều nằm ở dưới dạng con số:
#
#   1. WORKER_ID phải KHÁC VM (`tong-mon-khoiloi`). Trùng tên thì hai tiến trình ghi đè nhau
#      trong bảng `workers`, và mục Khôi Lỗi trên dashboard nói dối về việc ai đang trực.
#
#   2. Tuổi thọ phải NGẮN HƠN trần của nền tảng. Runner bị giết cứng ở 6 giờ; giết giữa một ván
#      Mê Cung 35 phút thì nhịp tim tắt và `reapStaleJobs` kết liễu đàn ấy sau 3 phút. Nên:
#        thôi nhận việc ở phút 290 → chờ thu đàn tối đa 50 phút → 340 < 350 (timeout của job)
#        < 360 (trần nền tảng). Hai lớp đệm, mỗi lớp 10 phút.
#
#   3. Lịch phải DÀY HƠN tuổi thọ. 4 giờ một lần trong khi một lượt sống ~4,8 giờ, nên lượt kế
#      đã nằm chờ sẵn trong hàng đợi lúc lượt cũ thu đàn — `concurrency` giữ đúng một lượt chạy
#      và một lượt chờ, nên hai lượt không bao giờ chồng nhau mà khoảng hở giữa chúng gần bằng 0.
#
# SỨC CHỨA: runner 4 nhân/16GB. Đo trên VM 4 vCPU ngày 10/08/2026: 8 ghế → load 14 và đàn hỏng
# vì timeout; 5 ghế → load ~2. Runner có ít RAM hơn và chia sẻ I/O nên lấy 2 ghế, dè dặt có chủ
# ý — VM vẫn là chỗ gánh chính, đây là phần cộng thêm.
#
# CÀI ĐẶT — một việc, và lượt dựng tự động đã làm sẵn: Settings → Secrets and variables →
# Actions, thêm `WORKER_TOKEN` đúng giá trị đang đặt trên Vercel. Chỉ phải làm tay khi dựng kho
# bằng tay. Thiếu nó thì bước cuối dừng ngay với một câu nói rõ, không chạy rỗng rồi để người ta
# đoán.

name: "__PUBLIC_WORKFLOW_NAME__"

on:
  schedule:
    # Xem điều 3 ở trên: dày hơn tuổi thọ để lượt kế đã chờ sẵn khi lượt cũ rút lui.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      tuoi_tho_ms:
        # CHỈ để nghiệm phép nối chuỗi: bước cuối nằm sau worker, nên muốn thấy chuỗi chạy
        # thật thì phải cho lượt kết thúc sớm. Lượt theo cron KHÔNG bao giờ nhận input nên
        # luôn rơi về mặc định — hạ nó không chạm được production.
        description: "Tuổi thọ (ms) — để trống là dùng mặc định 290 phút"
        required: false
        default: ""

# Đúng MỘT khôi lỗi GitHub tại một thời điểm. `cancel-in-progress: false` là bắt buộc: huỷ lượt
# đang chạy nghĩa là cắt ngang đàn đang cày, đúng thứ cả thiết kế này sinh ra để tránh.
concurrency:
  group: linh-su-github
  cancel-in-progress: false

permissions:
  contents: read
  # Đủ để POST .../actions/workflows/<tệp>/dispatches — xem bước「Phát lượt kế」ở cuối.
  actions: write

jobs:
  linh-su:
    name: "__PUBLIC_JOB_NAME__"
    runs-on: ubuntu-latest
    # 350 phút: để timeout của GitHub bắn TRƯỚC trần 6 giờ của nền tảng, nên lượt chạy kết thúc
    # bằng một dòng đỏ đọc được thay vì biến mất không lời giải thích.
    timeout-minutes: 350
    steps:
      # Mốc giờ cho phanh chống vòng lặp ở bước cuối. Đặt TRƯỚC mọi thứ để nó tính cả thời
      # gian cài đặt — một lượt chết ngay lúc tải runtime cũng phải bị phanh giữ lại.
      - name: Đánh dấu giờ bắt đầu
        run: echo "BAT_DAU_LUC=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Repository source stays owned by the project. The worker runtime is downloaded into
      # RUNNER_TEMP, so promoting or updating a primary repository only touches this workflow.
      - name: Download current worker runtime
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://158.180.59.36.sslip.io' }}
          WORKER_FALLBACK_URL: ${{ vars.WORKER_FALLBACK_URL || 'https://auto-hh3d.vercel.app' }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/linh-su-runtime"
          rm -rf "$dir"
          mkdir -p "$dir"

          download_runtime() {
            local base="${1%/}"
            curl -fsSL --retry 3 --retry-delay 2 "$base/linh-su/goi-linh-su.tgz" | tar -xz -C "$dir"
          }

          if ! download_runtime "$WEB_URL"; then
            echo "::warning::Primary runtime endpoint failed; trying the trusted fallback."
            rm -rf "$dir"
            mkdir -p "$dir"
            download_runtime "$WORKER_FALLBACK_URL"
          fi

          test -f "$dir/worker.mjs"
          test -f "$dir/package.json"
          test -f "$dir/node_modules/playwright-core/cli.js"
          echo "LINH_SU_RUNTIME=$dir" >> "$GITHUB_ENV"

      - name: Install Chromium for worker runtime
        run: |
          set -eu
          cd "$LINH_SU_RUNTIME"
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Trực ca
        env:
          WEB_URL: ${{ vars.WEB_URL || 'https://158.180.59.36.sslip.io' }}
          WORKER_FALLBACK_URL: ${{ vars.WORKER_FALLBACK_URL || 'https://auto-hh3d.vercel.app' }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          WORKER_ID: github-khoiloi
          WORKER_MAX_JOBS: "2"
          WORKER_QUEST_TABS: "3"
          WORKER_MAX_LIFETIME_MS: ${{ inputs.tuoi_tho_ms || '17400000' }}
          WORKER_DRAIN_TIMEOUT_MS: "3000000"
          WORKER_SOLVE_TURNSTILE: "1"
        run: |
          set -eu
          if [ -z "${WORKER_TOKEN:-}" ]; then
            echo "::error::Missing WORKER_TOKEN secret."
            exit 1
          fi
          node "$LINH_SU_RUNTIME/worker.mjs"

      - name: Phát lượt kế
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cùng biểu thức với bước trên — hai chỗ phải cùng đọc một con số, bằng không phanh
          # canh theo tuổi thọ này mà worker sống theo tuổi thọ khác.
          TUOI_THO_MS: ${{ inputs.tuoi_tho_ms || '17400000' }}
        run: |
          set -eu
          troi=$(( $(date +%s) - BAT_DAU_LUC ))

          if [ "${TUOI_THO_MS:-0}" -le 0 ]; then
            echo "::warning::Không đọc được tuổi thọ (TUOI_THO_MS='${TUOI_THO_MS:-}') — không nối chuỗi, để cron đỡ."
            exit 0
          fi

          nguong=$(( TUOI_THO_MS / 2000 ))
          if [ "$troi" -lt "$nguong" ]; then
            echo "Lượt này mới sống ${troi}s, chưa quá nửa tuổi thọ (${nguong}s) — KHÔNG nối chuỗi."
            echo "Đây là phanh: một lượt chết yểu mà vẫn phát lượt kế là đốt phút Actions vô tận."
            echo "Cron sẽ dựng lại đội trong tối đa 4 giờ."
            exit 0
          fi

          # Tệp workflow trong kho khôi lỗi — khớp WORKFLOW_TARGET_PATH của scripts/githubKhoiloi.mts.
          ma=$(curl -sS -o /tmp/noi-chuoi.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/linh-su.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\"}") || ma=000

          if [ "$ma" = "204" ]; then
            echo "Đã phát lượt kế trên nhánh $GITHUB_REF_NAME (lượt này sống ${troi}s)."
          else
            echo "::error::Phát lượt kế HỎNG (HTTP $ma): $(head -c 300 /tmp/noi-chuoi.out 2>/dev/null || true)"
            echo "::error::Chuỗi đứt — đội phải chờ cron tới 4 giờ. Soi quyền actions:write của GITHUB_TOKEN."
            exit 1
          fi
